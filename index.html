  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: '⚡ IMtoAgent',
      repo: 'https://github.com/imtoagent/imtoagent',
      coverpage: true,
      loadNavbar: false,
      subMaxLevel: 3,
      auto2top: true,
      executeScript: true,
      mergeNavbar: false,
      topMargin: 60,
      themeColor: '#4a90d9',
      themeable: {
        readyTransition: true,
        responsiveTables: true
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search...',
        noData: 'No results.'
      },
      copyCode: {
        buttonText: '📋 Copy',
        errorText: '❌ Failed',
        successText: '✅ Copied!'
      },
      // Bind install-cmd copy button via docsify hook
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var boxes = document.querySelectorAll('.cover .cmd-box');
            boxes.forEach(function (box) {
              var btn = box.querySelector('.copy-btn');
              var cmd = box.querySelector('code');
              if (btn && cmd && !btn.dataset.bound) {
                btn.dataset.bound = '1';
                btn.addEventListener('click', function () {
                  var text = cmd.textContent.trim();
                  var originalBg = btn.style.background;
                  var originalBorder = btn.style.borderColor;
                  var originalColor = btn.style.color;
                  var originalText = btn.textContent;
                  function onSuccess() {
                    btn.style.background = 'rgba(34,197,94,0.3)';
                    btn.style.borderColor = 'rgba(34,197,94,0.5)';
                    btn.style.color = '#4ade80';
                    btn.textContent = '✅ Copied!';
                    setTimeout(function () {
                      btn.style.background = originalBg;
                      btn.style.borderColor = originalBorder;
                      btn.style.color = originalColor;
                      btn.textContent = originalText;
                    }, 2000);
                  }
                  function onFail() {
                    btn.style.background = 'rgba(239,68,68,0.3)';
                    btn.style.borderColor = 'rgba(239,68,68,0.5)';
                    btn.style.color = '#f87171';
                    btn.textContent = '❌ Failed';
                    setTimeout(function () {
                      btn.style.background = originalBg;
                      btn.style.borderColor = originalBorder;
                      btn.style.color = originalColor;
                      btn.textContent = originalText;
                    }, 2000);
                  }
                  if (navigator.clipboard) {
                    navigator.clipboard.writeText(text).then(onSuccess).catch(onFail);
                  } else {
                    try {
                      var ta = document.createElement('textarea');
                      ta.value = text;
                      ta.style.position = 'fixed';
                      ta.style.left = '-9999px';
                      document.body.appendChild(ta);
                      ta.select();
                      var ok = document.execCommand('copy');
                      document.body.removeChild(ta);
                      if (ok) onSuccess(); else onFail();
                    } catch (e) { onFail(); }
                  }
                });
              }
            });
          });
        }
      ]
    }
  </script>
